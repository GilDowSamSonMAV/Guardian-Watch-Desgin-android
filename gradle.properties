org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ✅ Fix: Force Gradle daemon to use JDK 21 (Kotlin crashes on JDK 25 version string)
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.11.10-hotspot

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 8.7 only lists compileSdk 35 as tested; we use 36 intentionally. Suppress advisory warning.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
kotlin.incremental=true

# Hilt: use KSP (faster than KAPT)
ksp.incremental=true
